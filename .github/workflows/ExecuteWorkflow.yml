name: Trigger Workflow in Other Repo

# on:
  # push:
    # branches:
      # - main  # Trigger on pushes to main branch

on:
  workflow_dispatch: # Allows you to trigger the workflow manually

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout source repository
        uses: actions/checkout@v3
        with:
          repository: Raamasaamy2025/RemoteApp.git  # Replace with your source repo
          token: ${{ secrets.GITHUB_TOKEN }}
          path: source
          ref: main
          
      - name: Checkout Destination Repository
        uses: actions/checkout@v3
        with:
          repository: Raamasaamy2025/TestPipe.git  # Replace with your destination repo
          token: ${{ secrets.GITHUB_TOKEN }}
          path: destination
          ref: RemoteApp
          
      # ***********************

      # - name: Checkout Source Repository
      #   uses: actions/checkout@v2
      #   with:
      #     repository: username/source-repo  # Replace with your source repo
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     path: source-repo

      # - name: Checkout Destination Repository
      #   uses: actions/checkout@v2
      #   with:
      #     repository: username/destination-repo  # Replace with your destination repo
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     path: destination-repo

      # - name: Copy Files
      #   run: |
      #     cp -r source/path/to/files/* destination/path/to/destination/

      # - name: Commit and Push Changes
      #   run: |
      #     cd destination
      #     git config --local user.email "you@example.com"  # Replace with your email
      #     git config --local user.name "Your Name"  # Replace with your name
      #     git add .
      #     git commit -m "Copy files from source repository"
      #     git push origin main  # Change this to your default branch
          
      # ***********************
      - name: Set up Git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      # - name: Clone destination repository
      #   run: |
      #     git clone https://x-access-token:${{ secrets.TARGET_REPO_PAT }}@github.com/Raamasaamy2025/TestPipe.git destination-repo

      - name: Copy specific files to destination repo
        run: |
          #Remove the folder, if alreay exists.
          if [ -d destination-repo/assets ]; then
            cd destination-repo
            rm -rf destination-repo/assets
            # git add .
            # git commit -m "Files removed from base repo"
            # git push origin main
            echo "Directory removed."
          else
            echo "Directory does not exist."
          fi

          # Copying files to Target Repo
          cp -r source-repo/assets destination-repo/
          # cp ./assets/entitlements/* destination-repo/assets/entitlements/
          
          cd destination-repo
          git add .
          git commit -m "Copied specific files from source repo"
          git push origin RemoteApp

      - name: Trigger Workflow in TestPipe Repository
        run: |
          REPO_OWNER="Raamasaamy2025"
          REPO_NAME="TestPipe"
          WORKFLOW_ID="CodeSign.yml"  # Filename of workflow in repo B
          GITHUB_TOKEN="${{ secrets.TARGET_REPO_PAT }}"  # This repository secret

          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -d '{
              "ref": "main",
              "inputs": {
                "ipa_path": "'"./assets/Remote.ipa"'",
                "certificate_name": "'"iPhone Distribution: Robert Bosch LLC. (KR97TMX6TT)"'",
                "main_new_bundle_id": "'"com.bosch.rbllc2test"'",
                "main_entitlements_plist_path": "'"./assets/entitlements/entitlements.plist"'",
                "output_ipa_path": "'"./output"'",
                "extension_entitlements_plist_dir": "'"./assets/entitlements/extensions"'",
                "extension_provisioning_profile_dir": "'""'"
              }
            }' \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/actions/workflows/$WORKFLOW_ID/dispatches"
