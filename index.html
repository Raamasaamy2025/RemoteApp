<!-- ./assets/entitlements/entitlements.plist -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entitlements</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
</head>
<body>
    <div class="container">
        <h1>Main app Entitlements list</h1>
        <table>
            <thead>
                <tr>
                    <th>Key</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody id="plistContent">
                <!-- Content will be populated by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        fetch('./assets/entitlements/entitlements.plist')
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data, "text/xml");
                const keys = xmlDoc.getElementsByTagName("key");
                const arrays = xmlDoc.getElementsByTagName("array");
                const values = xmlDoc.getElementsByTagName("string");
                const booleans = xmlDoc.getElementsByTagName("true");
                const falseValues = xmlDoc.getElementsByTagName("false");

                let output = '';
                for (let i = 0; i < keys.length; i++) {
                    let valueContent = '';

                    // Check if the value is an array
                    if (arrays[i]) {
                        const items = arrays[i].getElementsByTagName("string");
                        const booleanItems = arrays[i].getElementsByTagName("true");
                        const falseItems = arrays[i].getElementsByTagName("false");

                        // Collect array items
                        const arrayValues = [];
                        for (let j = 0; j < items.length; j++) {
                            arrayValues.push(items[j].textContent);
                        }
                        for (let j = 0; j < booleanItems.length; j++) {
                            arrayValues.push('true');
                        }
                        for (let j = 0; j < falseItems.length; j++) {
                            arrayValues.push('false');
                        }

                        valueContent = arrayValues.join(', '); // Join array items into a string
                    } else if (values[i]) {
                        valueContent = values[i].textContent;
                    } else if (booleans[i]) {
                        valueContent = 'true';
                    } else if (falseValues[i]) {
                        valueContent = 'false';
                    } else {
                        valueContent = 'N/A';
                    }

                    output += `<tr>
                        <td>${keys[i].textContent}</td>
                        <td>${valueContent}</td>
                    </tr>`;
                }
                document.getElementById('plistContent').innerHTML = output;
            })
            .catch(error => console.error('Error fetching PLIST:', error));
    </script>
</body>
</html>
