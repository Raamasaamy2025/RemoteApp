<!-- ./assets/entitlements/entitlements.plist -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entitlements.plist Content</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
</head>
<body>
    <div class="container">
        <h1>Entitlements.plist Content</h1>
        <table>
            <thead>
                <tr>
                    <th>Key</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody id="plistContent">
                <!-- Content will be populated by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        fetch('./assets/entitlements/entitlements.plist')
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data, "text/xml");
                const keys = xmlDoc.getElementsByTagName("key");
                const values = xmlDoc.getElementsByTagName("string"); // Adjust if you have different types

                let output = '';
                for (let i = 0; i < keys.length; i++) {
                    output += `<tr>
                        <td>${keys[i].textContent}</td>
                        <td>${values[i] ? values[i].textContent : 'N/A'}</td>
                    </tr>`;
                }
                document.getElementById('plistContent').innerHTML = output;
            })
            .catch(error => console.error('Error fetching PLIST:', error));
    </script>
</body>
</html>
